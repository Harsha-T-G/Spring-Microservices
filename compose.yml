services:
  inventory-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: ${INVENTORY_DB_USER:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_dev}
    ports:
      - "127.0.0.1:${INVENTORY_DB_PORT:-5433}:5432"
    volumes:
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 20
  order-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: order
      POSTGRES_USER: ${ORDER_DB_USER:-order}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_dev}
    ports:
      - "127.0.0.1:${ORDER_DB_PORT:-5434}:5432"
    volumes:
      - order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 20
  inventory-service:
    build: ./inventory-service
    depends_on:
      inventory-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      INVENTORY_DB_URL: jdbc:postgresql://inventory-db:5432/inventory
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:-inventory}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_dev}
    ports:
      - "127.0.0.1:${INVENTORY_PORT:-8081}:8081"
  order-service:
    build: ./order-service
    depends_on:
      order-db:
        condition: service_healthy
      inventory-service:
        condition: service_started
    environment:
      INVENTORY_BASE_URL: http://inventory-service:8081
      ORDER_DB_URL: jdbc:postgresql://order-db:5432/order
      ORDER_DB_USER: ${ORDER_DB_USER:-order}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-order_dev}
    ports:
      - "127.0.0.1:${ORDER_PORT:-8080}:8080"
volumes:
  inventory-data:
  order-data:
