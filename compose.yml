services:
  postgres-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: microservices
      POSTGRES_USER: ${DB_USER:-microservices}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-microservices_dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 20
  inventory-service:
    build: ./inventory-service
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres-db:5432/microservices
      DB_USER: ${DB_USER:-microservices}
      DB_PASSWORD: ${DB_PASSWORD:-microservices_dev}
    ports:
      - "127.0.0.1:${INVENTORY_PORT:-8081}:8081"
  order-service:
    build: ./order-service
    depends_on:
      postgres-db:
        condition: service_healthy
      inventory-service:
        condition: service_started
    environment:
      INVENTORY_BASE_URL: http://inventory-service:8081
      DB_URL: jdbc:postgresql://postgres-db:5432/microservices
      DB_USER: ${DB_USER:-microservices}
      DB_PASSWORD: ${DB_PASSWORD:-microservices_dev}
    ports:
      - "127.0.0.1:${ORDER_PORT:-8080}:8080"
volumes:
  postgres-data:
